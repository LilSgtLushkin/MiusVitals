name: Verify MiusMultiplayer release archives

# The automatic full native checks are part of build-network-module.yml's single final PR
# workflow. Keep this workflow available for an explicit standalone recheck only.
on:
  workflow_dispatch:

jobs:
  native-artifact-and-kit-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify hashes, PE surface, exact kit and native logic
        run: scripts/verify_release.sh
      - name: Upload current experimental net+fps installer
        uses: actions/upload-artifact@v4
        with:
          name: MiusMultiplayer_v1.0.7_EXPERIMENTAL_NET_FPS_INSTALL
          path: MiusMultiplayer_v1.0.7_EXPERIMENTAL_NET+FPS_INSTALL.zip
          if-no-files-found: error
      - name: Upload outdated rollback installer
        uses: actions/upload-artifact@v4
        with:
          name: MiusMultiplayer_OUTDATED_INSTALL
          path: MiusMultiplayer_OUTDATED_INSTALL.zip
          if-no-files-found: error
      - name: Upload experimental GTMP_alpha installer
        uses: actions/upload-artifact@v4
        with:
          name: GTMP_alpha_INSTALL
          path: GTMP_alpha_INSTALL.zip
          if-no-files-found: error
