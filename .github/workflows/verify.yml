name: Verify MiusMultiplayer release archives

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  native-artifact-and-kit-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify hashes, PE surface, exact kit and native logic
        run: scripts/verify_release.sh
      - name: Upload current unified Steam + FPS installer
        uses: actions/upload-artifact@v4
        with:
          name: MiusMultiplayer_v1.0.1_INSTALL
          path: MiusMultiplayer_v1.0.1_INSTALL.zip
          if-no-files-found: error
      - name: Upload outdated rollback installer
        uses: actions/upload-artifact@v4
        with:
          name: MiusMultiplayer_OUTDATED_INSTALL
          path: MiusMultiplayer_OUTDATED_INSTALL.zip
          if-no-files-found: error
      - name: Upload experimental GTMP_alpha installer
        uses: actions/upload-artifact@v4
        with:
          name: GTMP_alpha_INSTALL
          path: GTMP_alpha_INSTALL.zip
          if-no-files-found: error
