name: Verify MiusVitals v7.2.2

on:
  push:
    branches: ["arena/8617d90b-miusvitals"]
  pull_request:
  workflow_dispatch:

jobs:
  native-artifact-and-kit-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify hashes, PE surface, exact kit and native logic
        run: scripts/verify_release.sh
      - name: Upload exact downloadable kit
        uses: actions/upload-artifact@v4
        with:
          name: MiusVitals_v7.2.2_INSTALL
          path: MiusVitals_v7.2.2_INSTALL.zip
          if-no-files-found: error
