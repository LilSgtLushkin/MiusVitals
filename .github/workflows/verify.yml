name: Verify MiusMultiplayer stable and FPS beta

on:
  push:
    branches: ["arena/a496e0bd-miusvitals"]
  pull_request:
  workflow_dispatch:

jobs:
  native-artifact-and-kit-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify hashes, PE surface, exact kit and native logic
        run: scripts/verify_release.sh
      - name: Upload current unified Steam + FPS installer
        uses: actions/upload-artifact@v4
        with:
          name: MiusMultiplayer_v1.0.1_INSTALL
          path: MiusMultiplayer_v1.0.1_INSTALL.zip
          if-no-files-found: error
      - name: Upload legacy stable unified installer
        uses: actions/upload-artifact@v4
        with:
          name: MiusMultiplayer_v1.0.0_INSTALL
          path: MiusMultiplayer_v1.0.0_INSTALL.zip
          if-no-files-found: error
      - name: Upload experimental FPS beta installer
        uses: actions/upload-artifact@v4
        with:
          name: MiusMultiplayer_beta_FPS_fix_INSTALL
          path: MiusMultiplayer_beta_FPS_fix_INSTALL.zip
          if-no-files-found: error
