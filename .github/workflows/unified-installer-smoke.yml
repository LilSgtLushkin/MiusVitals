name: Test unified installer on Windows

# Fast feedback on actual BAT/PowerShell behavior using disposable PE packaging fixtures.
# The network-module workflow separately tests the real MSVC-built archive before publication.
on:
  push:
    branches-ignore: ['main']
    paths:
      - 'development/net-v21-kit/**'
      - 'scripts/package_net_v21_test*.py'
      - 'tests/test_unified_installer_windows.py'
      - 'tests/build_unified_installer_fixture.py'
      - '.github/workflows/unified-installer-smoke.yml'

permissions:
  contents: read

concurrency:
  group: unified-installer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch the pinned installers the upgrade tests read
        shell: bash
        run: |
          set -euo pipefail
          # The upgrade and rollback tests read retired installers straight from Git. A shallow
          # checkout does not carry those commits, so they are fetched by revision here.
          git fetch --no-tags --depth=1 origin 047195f1b16f034cf06f4a204402e6e800ca05ea
          git fetch --no-tags --depth=1 origin 14adad9432ca01991c5ff91d437cab4fa017d598
      - name: Build a disposable packaging fixture
        shell: cmd
        run: |
          set "MIUS_TEST_ARCHIVE=%RUNNER_TEMP%\mius-installer-fixture.zip"
          python tests\build_unified_installer_fixture.py "%MIUS_TEST_ARCHIVE%"
          if errorlevel 1 exit /b 1
      - name: Test one-step install and recovery
        shell: cmd
        run: |
          set "MIUS_TEST_ARCHIVE=%RUNNER_TEMP%\mius-installer-fixture.zip"
          set "MIUS_TEST_STATE=unified_test_v107_experimental_net_fps"
          set "MIUS_TEST_UPGRADE_107_EXPERIMENTAL=1"
          rem Partial feedback only; the final workflow runs the complete installer suite once.
          python tests\test_unified_installer_windows.py UnifiedInstaller.test_one_step_repeat_check_and_uninstall UnifiedInstaller.test_old_107_experimental_then_fps_and_two_step_rollback > "%RUNNER_TEMP%\mius-installer-tests.log" 2>&1
          set rc=%errorlevel%
          type "%RUNNER_TEMP%\mius-installer-tests.log"
          if not %rc%==0 (
            powershell -NoProfile -Command "$m = ((Get-Content (Join-Path $env:RUNNER_TEMP 'mius-installer-tests.log') -Tail 100) -join ' | ').Replace('%%','%%25'); Write-Output ('::error title=Installer smoke test::' + $m)"
            exit /b %rc%
          )
