name: Build ordered operation source candidate

on:
  push:
    paths:
      - .github/workflows/build-ordered-operation-candidate.yml
      - development/merged-source/patches/0001-elide-idempotent-remote-transform-writes.patch
      - development/merged-source/patches/0002-ordered-operation-turns-and-network-hygiene.patch
      - development/merged-source/prepare_ordered_operation_candidate.py
      - development/merged-source/tests/test_ordered_operation_patch.py
      - development/upstream/miusplayer-public-43b2736/basic_network/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-source-only-candidate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Apply reviewed overlays in a disposable Windows workspace
        shell: cmd
        run: |
          rem Avoid Windows checkout CRLF conversion before applying the LF-reviewed overlays.
          git config core.autocrlf false || exit /b 1
          git reset --hard HEAD || exit /b 1
          git apply --check development\merged-source\patches\0001-elide-idempotent-remote-transform-writes.patch || exit /b 1
          git apply development\merged-source\patches\0001-elide-idempotent-remote-transform-writes.patch || exit /b 1
          git apply --check development\merged-source\patches\0002-ordered-operation-turns-and-network-hygiene.patch || exit /b 1
          git apply development\merged-source\patches\0002-ordered-operation-turns-and-network-hygiene.patch || exit /b 1

      - name: Compile codelib twice and matching join launcher with VS2022 x64
        shell: cmd
        run: |
          @echo on
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%I\VC\Auxiliary\Build\vcvars64.bat"
          if not defined VCToolsInstallDir exit /b 1
          cd /d "%GITHUB_WORKSPACE%\development\upstream\miusplayer-public-43b2736\basic_network"
          if not exist build-operation-a mkdir build-operation-a
          cl /nologo /LD /MD /O1 /EHa /W3 /Fo"build-operation-a\\" basic_network.cpp session.cpp ui.cpp state.cpp statesync.cpp shots.cpp trench.cpp xlate.cpp /link user32.lib gdi32.lib ws2_32.lib ole32.lib oleaut32.lib /Brepro /OUT:build-operation-a\basic_network.codelib /IMPLIB:build-operation-a\basic_network.lib || exit /b 1
          if not exist build-operation-b mkdir build-operation-b
          cl /nologo /LD /MD /O1 /EHa /W3 /Fo"build-operation-b\\" basic_network.cpp session.cpp ui.cpp state.cpp statesync.cpp shots.cpp trench.cpp xlate.cpp /link user32.lib gdi32.lib ws2_32.lib ole32.lib oleaut32.lib /Brepro /OUT:build-operation-b\basic_network.codelib /IMPLIB:build-operation-b\basic_network.lib || exit /b 1
          fc /b build-operation-a\basic_network.codelib build-operation-b\basic_network.codelib || exit /b 1
          cl /nologo /EHsc /O1 /W3 mp_join.cpp /link ws2_32.lib /OUT:build-operation-a\mp_join.exe || exit /b 1

      - name: Record source-only candidate hashes
        shell: pwsh
        run: |
          $network = 'development/upstream/miusplayer-public-43b2736/basic_network/build-operation-a/basic_network.codelib'
          $joiner = 'development/upstream/miusplayer-public-43b2736/basic_network/build-operation-a/mp_join.exe'
          $networkHash = (Get-FileHash -LiteralPath $network -Algorithm SHA256).Hash.ToLower()
          $joinerHash = (Get-FileHash -LiteralPath $joiner -Algorithm SHA256).Hash.ToLower()
          "$networkHash  basic_network.codelib" | Set-Content -NoNewline -Encoding ascii ordered-operation.sha256
          "$joinerHash  mp_join.exe" | Add-Content -Encoding ascii ordered-operation.sha256
          Get-Content ordered-operation.sha256

      - name: Upload unvalidated ordered-operation source build
        uses: actions/upload-artifact@v4
        with:
          name: ordered-operation-source-only-candidate
          path: |
            development/upstream/miusplayer-public-43b2736/basic_network/build-operation-a/basic_network.codelib
            development/upstream/miusplayer-public-43b2736/basic_network/build-operation-a/mp_join.exe
            ordered-operation.sha256
          if-no-files-found: error
          retention-days: 14
