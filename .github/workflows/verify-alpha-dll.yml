name: Rebuild GTMP_alpha mp_vitals.dll

on:
  push:
    paths:
      - .github/workflows/verify-alpha-dll.yml
      - development/kit-source/src/mp_vitals.c
      - development/kit-source/src/build.sh
      - development/kit-source/src/requirements-build.txt
      - development/gtmp-alpha/**
      - scripts/package_gtmp_alpha.py
      - GTMP_alpha_INSTALL.zip
  pull_request:
    paths:
      - .github/workflows/verify-alpha-dll.yml
      - development/kit-source/src/mp_vitals.c
      - development/kit-source/src/build.sh
      - development/kit-source/src/requirements-build.txt
      - development/gtmp-alpha/**
      - scripts/package_gtmp_alpha.py
      - GTMP_alpha_INSTALL.zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-alpha-dll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The baseline check rebuilds the source of an earlier commit, so the full history is needed.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned Zig toolchain
        run: pip install -r development/kit-source/src/requirements-build.txt

      - name: Rebuild the alpha DLL and compare it with the committed one
        run: development/gtmp-alpha/rebuild.sh

      - name: Prove the same toolchain reproduces the stable v1.0.1 DLL
        run: development/gtmp-alpha/rebuild.sh --baseline e8d4a52

      - name: Verify the committed alpha installer
        run: python3 scripts/package_gtmp_alpha.py --verify GTMP_alpha_INSTALL.zip

      - name: Upload the rebuilt alpha DLL
        uses: actions/upload-artifact@v4
        with:
          name: gtmp-alpha-mp_vitals
          path: development/gtmp-alpha/files/mp_vitals.dll
          if-no-files-found: error
