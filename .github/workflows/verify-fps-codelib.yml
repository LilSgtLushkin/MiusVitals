name: Verify Steam-preserving FPS codelib

on:
  push:
    paths:
      - .github/workflows/verify-fps-codelib.yml
      - scripts/build_steam_compatible_fps_candidate.py
      - development/kit-source/files/basic_network.codelib
      - development/fps-candidate/**
  pull_request:
    paths:
      - .github/workflows/verify-fps-codelib.yml
      - scripts/build_steam_compatible_fps_candidate.py
      - development/kit-source/files/basic_network.codelib
      - development/fps-candidate/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-steam-preserving-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify the deterministic Steam-preserving FPS candidate
        run: |
          python3 scripts/build_steam_compatible_fps_candidate.py build --output /tmp/basic_network.codelib
          cmp /tmp/basic_network.codelib development/fps-candidate/basic_network.codelib
          python3 scripts/build_steam_compatible_fps_candidate.py verify

      - name: Verify the current installer carrying that candidate
        run: |
          python3 scripts/package_unified_fps_mod.py --verify MiusMultiplayer_v1.0.1_INSTALL.zip
