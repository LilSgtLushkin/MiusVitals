name: Final validation (network, installer and native checks)

# M1 and M2 from docs/V20_SOURCE_RECOVERY.md, done the only way that can be trusted: build the tree
# with the author's own compiler settings on Windows, then measure the result against the two
# modules that exist - v12 (published source build) and v20 (what players run).
#
#   baseline  the published sources, untouched  -> should reproduce v12 function for function
#   module    the same sources plus our Steam layer -> compared against v20 with focus on Steam
#   selftest  the Steam layer alone, on a machine with no Steam at all
#
# A red comparison is information, not a failure: the job prints the numbers and the tables.

# Pushes before a PR get only focused tests. The one full release gate runs on the
# final, non-draft PR head; a later push invalidates that result and must run it again.
# Merging to main does not duplicate the full run. Manual dispatch remains available.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# A new push makes the previous run's validation stale; the newest run wins.
concurrency:
  group: network-module-${{ github.ref }}
  cancel-in-progress: true

# The version being built. Sources live in development/versions/<version>/, one folder per
# release; bumping this is part of making a release, together with development/versions/current.txt.
env:
  VERSION: 1.0.8

jobs:
  native-artifact-and-kit-checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify hashes, PE surfaces, archives and native logic
        run: scripts/verify_release.sh
      - name: Execute native cache-bounds stub test
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -Werror development/versions/${{ env.VERSION }}/tools/render_cache_bounds_native_test.cpp -o /tmp/render-cache-test
          /tmp/render-cache-test

  build-and-compare:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the supplied game reference and PE address scanner
        run: |
          python development/game-build-3598-1/manifest.py --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/game-build-3598-1/manifest_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/versions/${{ env.VERSION }}/tools/pe_scan_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/versions/${{ env.VERSION }}/tools/hook_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/versions/${{ env.VERSION }}/tools/hook_audit_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/versions/${{ env.VERSION }}/tools/tactical_hook_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/versions/${{ env.VERSION }}/tools/vitals_hook_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/versions/${{ env.VERSION }}/tools/vitals_hook_audit_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/versions/${{ env.VERSION }}/tools/statesync_legacy_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/versions/${{ env.VERSION }}/tools/ui_text_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test archive validation and rollback protection
        run: |
          python scripts/package_net_v21_test_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test the log collector with a simulated game folder
        shell: powershell
        run: |
          & development/versions/${{ env.VERSION }}/tools/collect_logs_selftest.ps1
          if (-not $?) { exit 1 }
      - name: Verify the shipped installer before rebuilding
        shell: bash
        run: |
          set -euo pipefail
          # Structure plus the SHA-256 recorded beside it. The installer is rebuilt from the gated
          # source, so no fixed hash is pinned: the hash a pin would hold is written by the same
          # job that builds the file. The check itself lives in one place, not copied here.
          archive="MiusMultiplayer_v${{ env.VERSION }}_INSTALL.zip"
          # A version bump lands before its installer does: the gate runs on the source, and
          # publish-installer.yml commits the archive only after this workflow is green.
          if [ ! -f "$archive" ]; then
            echo "::notice title=Shipped installer::$archive is not in the tree yet: version ${{ env.VERSION }} is not published. It is built below and committed by publish-installer.yml."
            exit 0
          fi
          python scripts/check_shipped_installer.py "$archive"
          sha256sum "$archive"

      - name: Install the disassembler and offline x64 emulator
        run: python -m pip install --quiet capstone unicorn==2.1.4

      - name: Check description identity evidence against the supplied PE images
        run: |
          python development/versions/${{ env.VERSION }}/tools/xlate_identity_pe_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/versions/${{ env.VERSION }}/tools/xlate_identity_emulation_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/versions/${{ env.VERSION }}/tools/human_hit_evidence_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/versions/${{ env.VERSION }}/tools/render_cache_bounds_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch the two reference modules (pinned, SHA-256 checked)
        run: python development/versions/${{ env.VERSION }}/tools/fetch_references.py

      - name: M1 - build the published sources exactly as published
        shell: cmd
        run: |
          if not exist development\versions\${{ env.VERSION }}\build mkdir development\versions\${{ env.VERSION }}\build
          call development\versions\${{ env.VERSION }}\build.bat baseline > development\versions\${{ env.VERSION }}\build\baseline.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\baseline.log
          exit /b %rc%

      - name: M2 - build the same tree plus the Steam layer
        shell: cmd
        run: |
          call development\versions\${{ env.VERSION }}\build.bat module > development\versions\${{ env.VERSION }}\build\module.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\module.log
          exit /b %rc%

      - name: M2 - build and run the Steam self-test (no Steam, no game needed)
        shell: cmd
        run: |
          call development\versions\${{ env.VERSION }}\build.bat selftest > development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\steam_selftest.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\steam_friends_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\netlog_selftest.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\vitals_core_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\vitals_randomized_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\hit_anim_wire_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\animation_channel_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\pause_sync_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          rem The pause/state-header slice runs inside build.bat selftest: it needs the compiler that
          rem script puts on PATH, which the step's own shell does not have.
          development\versions\${{ env.VERSION }}\build\selftest\hit_anim_integration_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\vitals_integration_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\protocol_selftest.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\operation_turn_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\opsave_checked_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\map_file_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\map_file_windows_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\force_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\battle_file_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\retry_gate_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\atomic_file_selftest.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\reliable_inbox_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\ceasefire_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\env_value_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\tactical_mode_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\transform_write_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\transform_gc_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\transform_object_check_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\state_apply_delay_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\squad_ownership_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\image_mirror_identity_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\transform_send_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\transform_inbox_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\transport_policy_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\peer_guard_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\state_fragments_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\statesync_integration_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\state_memory_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\hooks_selftest.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\render_guard_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\xlate_selftest.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\trench_thread_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\shots_integration_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\named_shots_integration_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\shots_xlate_characterization_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\versions\${{ env.VERSION }}\build\selftest\late_input_test.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          python tests\test_switch_pair_windows.py >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          python development\versions\${{ env.VERSION }}\tools\loopback_pair.py --peer development\versions\${{ env.VERSION }}\build\selftest\loopback_peer.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          python development\versions\${{ env.VERSION }}\tools\session_loopback_pair.py --peer development\versions\${{ env.VERSION }}\build\selftest\session_loopback_peer.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          if not %rc%==0 exit /b %rc%
          python development\versions\${{ env.VERSION }}\tools\event_loopback_pair.py --peer development\versions\${{ env.VERSION }}\build\selftest\session_event_peer.exe >> development\versions\${{ env.VERSION }}\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\selftest.log
          exit /b %rc%

      # Keep the failing test/compiler tail visible through the checks API, even where Actions'
      # external log/artifact storage is inaccessible. Tests here use only synthetic data.
      - name: Expose the self-test failure
        if: failure()
        shell: pwsh
        run: |
          $log = 'development/versions/${{ env.VERSION }}/build/selftest.log'
          if (Test-Path -LiteralPath $log) {
            $tail = ((Get-Content -LiteralPath $log -Tail 60) -join ' | ').Replace('%', '%25')
            Write-Output "::error title=Self-test log::$tail"
          }

      - name: M2 - build the command-line join launcher with the Steam layer
        shell: cmd
        run: |
          call development\versions\${{ env.VERSION }}\build.bat join > development\versions\${{ env.VERSION }}\build\join.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\join.log
          exit /b %rc%

      - name: Exercise the standalone launcher over IP and fake Steam (no game)
        shell: cmd
        run: |
          python development\versions\${{ env.VERSION }}\tools\standalone_loopback.py --peer development\versions\${{ env.VERSION }}\build\selftest\session_loopback_peer.exe --launcher development\versions\${{ env.VERSION }}\build\join\mp_join.exe --starter development\versions\${{ env.VERSION }}\build\selftest\starter_fixture.exe > development\versions\${{ env.VERSION }}\build\launcher-selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\launcher-selftest.log
          if not %rc%==0 (
            powershell -NoProfile -Command "$m = ((Get-Content development/versions/${{ env.VERSION }}/build/launcher-selftest.log -Tail 40) -join ' | ').Replace('%%','%%25'); Write-Output ('::error title=Launcher self-test::' + $m)"
            exit /b %rc%
          )

      - name: M1 - compare our baseline against the released v12 module
        shell: bash
        run: |
          python development/versions/${{ env.VERSION }}/tools/compare.py \
            --candidate development/versions/${{ env.VERSION }}/build/baseline/basic_network.codelib \
            --candidate-map development/versions/${{ env.VERSION }}/build/baseline/basic_network.map \
            --reference development/versions/${{ env.VERSION }}/references/v12.codelib \
            --reference-kind v12 --label "M1 baseline vs v12" \
            --out development/versions/${{ env.VERSION }}/build/compare-m1.md \
            --json development/versions/${{ env.VERSION }}/build/compare-m1.json \
            2>&1 | tee development/versions/${{ env.VERSION }}/build/compare-m1.log
          exit ${PIPESTATUS[0]}

      - name: M2 - compare our module against the v20 module players run
        shell: bash
        run: |
          python development/versions/${{ env.VERSION }}/tools/compare.py \
            --candidate development/versions/${{ env.VERSION }}/build/module/basic_network.codelib \
            --candidate-map development/versions/${{ env.VERSION }}/build/module/basic_network.map \
            --reference development/versions/${{ env.VERSION }}/references/v20.codelib \
            --reference-kind v20 --label "M2 module vs v20" \
            --focus steam,gtmf,presence,upnp,find_local \
            --out development/versions/${{ env.VERSION }}/build/compare-m2.md \
            --json development/versions/${{ env.VERSION }}/build/compare-m2.json \
            --missing-out development/versions/${{ env.VERSION }}/build/missing-m2.txt \
            2>&1 | tee development/versions/${{ env.VERSION }}/build/compare-m2.log
          exit ${PIPESTATUS[0]}

      - name: Self-test the battle report (the tool a two-PC run is read with)
        shell: bash
        run: |
          python development/versions/${{ env.VERSION }}/tools/battle_report_selftest.py \
            2>&1 | tee development/versions/${{ env.VERSION }}/build/battle-report-selftest.log
          exit ${PIPESTATUS[0]}

      # Build a disposable ZIP from this exact PR head. The previously released net+fps ZIP
      # remains immutable and is verified separately; it is not this revised source tree.
      - name: Build the current disposable installer
        shell: bash
        run: |
          python scripts/package_net_v21_test.py \
            --codelib development/versions/${{ env.VERSION }}/build/module/basic_network.codelib \
            --launcher development/versions/${{ env.VERSION }}/build/join/mp_join.exe \
            --output development/versions/${{ env.VERSION }}/build/CI_fixture_NOT_RELEASE.zip \
            2>&1 | tee development/versions/${{ env.VERSION }}/build/package.log
          exit ${PIPESTATUS[0]}

      # The shipped installer is already verified above, structurally and against the hash recorded
      # beside it. What this adds is the proof that a build of THIS source is a valid installer: the
      # disposable ZIP is checked against the tree it was just built from.
      - name: Verify the current disposable installer against this source tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_net_v21_test.py --verify development/versions/${{ env.VERSION }}/build/CI_fixture_NOT_RELEASE.zip --verify-source
          sha256sum development/versions/${{ env.VERSION }}/build/CI_fixture_NOT_RELEASE.zip

      # No retired ZIP is restored into the checkout. The Windows test reads each historical
      # installer as a Git blob in memory and verifies its SHA-256 before exercising rollback, so
      # the shallow clone only needs the pinned commits that still hold those files.
      - name: Fetch the pinned historical commits for the upgrade fixtures
        shell: bash
        run: |
          set -euo pipefail
          fetch_pinned() {
            revision=$1
            name=$2
            if ! git cat-file -e "$revision:$name" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$revision"
            fi
            git cat-file -e "$revision:$name"
          }
          fetch_pinned 047195f1b16f034cf06f4a204402e6e800ca05ea MiusMultiplayer_v1.0.6_TEST_INSTALL.zip
          fetch_pinned 14adad9432ca01991c5ff91d437cab4fa017d598 MiusMultiplayer_v1.0.7_TEST_INSTALL.zip
          fetch_pinned 14adad9432ca01991c5ff91d437cab4fa017d598 MiusMultiplayer_v1.0.7_EXPERIMENTAL_INSTALL.zip

      - name: Exercise the current one-step installer and historical upgrades on Windows
        shell: cmd
        env:
          MIUS_TEST_ARCHIVE: development/versions/${{ env.VERSION }}/build/CI_fixture_NOT_RELEASE.zip
          MIUS_TEST_STATE: unified_test_v107_experimental_net_fps
          MIUS_TEST_UPGRADE: '1'
          MIUS_TEST_UPGRADE_107_EXPERIMENTAL: '1'
        run: |
          python tests\test_unified_installer_windows.py > development\versions\${{ env.VERSION }}\build\installer-selftest.log 2>&1
          set rc=%errorlevel%
          type development\versions\${{ env.VERSION }}\build\installer-selftest.log
          if not %rc%==0 (
            powershell -NoProfile -Command "$m = ((Get-Content development/versions/${{ env.VERSION }}/build/installer-selftest.log -Tail 50) -join ' | ').Replace('%%','%%25'); Write-Output ('::error title=Installer self-test::' + $m)"
            exit /b %rc%
          )

      # Released archives are preserved; new candidates require a separately named archive and
      # explicit validation. The workflow never publishes or replaces one automatically.

      - name: Put the numbers in the job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## M1: our build of the published sources vs the released v12 module'
            cat development/versions/${{ env.VERSION }}/build/compare-m1.md 2>/dev/null || echo 'no comparison: the build did not produce a module'
            echo
            echo '## M2: our module (published sources + Steam layer) vs the v20 module'
            cat development/versions/${{ env.VERSION }}/build/compare-m2.md 2>/dev/null || echo 'no comparison: the build did not produce a module'
          } >> "$GITHUB_STEP_SUMMARY"

      # The job log is not reachable from outside this cluster (the log endpoint is blocked), so the
      # compiler output is mirrored into a pull-request comment while the build is being brought up.
      - name: Mirror the compiler output into the pull request
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The job log is not reachable from where this build is checked, so the output has to be
          # reachable somewhere else.  On a pull request that is the request itself; on a push it is
          # whatever request is open for this branch, which is how work continues after a merge.
          number="${{ github.event.number }}"
          if [ -z "$number" ]; then
            number=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          fi
          if [ -z "$number" ]; then echo "no pull request to mirror into"; exit 0; fi
          body=/tmp/build-comment.md
          {
            echo "### network module build (${{ github.sha }})"
            for report in compare-m1 compare-m2; do
              echo
              echo "#### $report"
              cat "development/versions/${{ env.VERSION }}/build/$report.md" 2>/dev/null || echo "no $report report"
            done
            if [ -f development/versions/${{ env.VERSION }}/build/missing-m2.txt ]; then
              echo
              echo "<details><summary>every missing work item, by milestone</summary>"
              echo
              echo '```'
              cat development/versions/${{ env.VERSION }}/build/missing-m2.txt
              echo '```'
              echo
              echo '</details>'
            fi
            echo
            if [ -f MiusMultiplayer_v${{ env.VERSION }}_INSTALL.zip ]; then
              echo "shipped installer: sha256 $(sha256sum MiusMultiplayer_v${{ env.VERSION }}_INSTALL.zip | cut -d' ' -f1)"
              echo "recorded beside it: $(head -1 MiusMultiplayer_v${{ env.VERSION }}_INSTALL.zip.sha256.txt)"
            fi
            if [ -f development/versions/${{ env.VERSION }}/build/CI_fixture_NOT_RELEASE.zip ]; then
              echo "current build: disposable installer fixture only, not a release"
            fi
            for name in shipped-installer baseline module selftest join launcher-selftest installer-selftest battle-report-selftest package compare-m1 compare-m2; do
              log="development/versions/${{ env.VERSION }}/build/$name.log"
              echo
              echo "<details><summary>$name log</summary>"
              echo
              echo '```'
              if [ -f "$log" ]; then tail -c 6000 "$log"; else echo "$name: no log produced"; fi
              echo '```'
              echo
              echo '</details>'
            done
          } > "$body"
          gh pr comment "$number" --body-file "$body"

      - name: Upload the build, the logs and both comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-module
          path: |
            development/versions/${{ env.VERSION }}/build/**
            !development/versions/${{ env.VERSION }}/build/CI_fixture_NOT_RELEASE.zip
          if-no-files-found: warn
          retention-days: 14
