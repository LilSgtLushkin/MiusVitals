name: Build network module

# M1 and M2 from docs/V20_SOURCE_RECOVERY.md, done the only way that can be trusted: build the tree
# with the author's own compiler settings on Windows, then measure the result against the two
# modules that exist - v12 (published source build) and v20 (what players run).
#
#   baseline  the published sources, untouched  -> should reproduce v12 function for function
#   module    the same sources plus our Steam layer -> compared against v20 with focus on Steam
#   selftest  the Steam layer alone, on a machine with no Steam at all
#
# A red comparison is information, not a failure: the job prints the numbers and the tables.

on:
  push:
    paths:
      - "development/net-v21/**"
      - "development/net-v21-kit/**"
      - "development/game-build-3598-1/**"
      - "scripts/package_net_v21_test.py"
      - "scripts/package_net_v21_test_selftest.py"
      - "tests/test_unified_installer_windows.py"
      - "tests/test_switch_pair_windows.py"
      - "docs/NET_V21_M5_VALIDATION_2026-10-27.md"
      - ".github/workflows/build-network-module.yml"
  pull_request:
    paths:
      - "development/net-v21/**"
      - "development/net-v21-kit/**"
      - "development/game-build-3598-1/**"
      - "scripts/package_net_v21_test.py"
      - "scripts/package_net_v21_test_selftest.py"
      - "tests/test_unified_installer_windows.py"
      - "tests/test_switch_pair_windows.py"
      - "docs/NET_V21_M5_VALIDATION_2026-10-27.md"
      - ".github/workflows/build-network-module.yml"
  workflow_dispatch:

permissions:
  contents: write  # temporary: publish the one approved experimental archive after validation
  pull-requests: write

# A new push makes the previous run's validation stale; the newest run wins.
concurrency:
  group: network-module-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-compare:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the supplied game reference and PE address scanner
        run: |
          python development/game-build-3598-1/manifest.py --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/game-build-3598-1/manifest_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/net-v21/tools/pe_scan_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/net-v21/tools/hook_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/net-v21/tools/hook_audit_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/net-v21/tools/tactical_hook_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/net-v21/tools/vitals_hook_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/net-v21/tools/vitals_hook_audit_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/net-v21/tools/statesync_legacy_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/net-v21/tools/ui_text_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test archive validation and rollback protection
        run: |
          python scripts/package_net_v21_test_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test the log collector with a simulated game folder
        shell: powershell
        run: |
          & development/net-v21/tools/collect_logs_selftest.ps1
          if (-not $?) { exit 1 }

      - name: Verify the committed unified installer before rebuilding
        shell: cmd
        run: |
          if not exist MiusMultiplayer_v1.0.7_TEST_INSTALL.zip goto :no_committed_installer
          if not exist development\net-v21\build mkdir development\net-v21\build
          rem The released archive is historical; verify its passport and pinned hash, not against the new experimental source.
          python scripts\package_net_v21_test.py --verify MiusMultiplayer_v1.0.7_TEST_INSTALL.zip > development\net-v21\build\committed-installer.log 2>&1
          set rc=%errorlevel%
          if not %rc%==0 goto :committed_installer_failed
          python -c "import hashlib,pathlib; p=pathlib.Path('MiusMultiplayer_v1.0.7_TEST_INSTALL.zip'); assert hashlib.sha256(p.read_bytes()).hexdigest()=='65f7a325095577cec98b2bab590f4674b81ad240bc5191adce346ebf8bec5ec6'" >> development\net-v21\build\committed-installer.log 2>&1
          set rc=%errorlevel%
          if not %rc%==0 goto :committed_installer_failed
          python tests\test_unified_installer_windows.py >> development\net-v21\build\committed-installer.log 2>&1
          set rc=%errorlevel%
          if not %rc%==0 goto :committed_installer_failed
          type development\net-v21\build\committed-installer.log
          exit /b 0
          :committed_installer_failed
          type development\net-v21\build\committed-installer.log
          powershell -NoProfile -Command "$m = ((Get-Content development/net-v21/build/committed-installer.log -Tail 100) -join ' | ').Replace('%%','%%25'); Write-Output ('::error title=Committed installer verification::' + $m)"
          exit /b %rc%
          :no_committed_installer
          echo First build: no committed 1.0.7 archive yet.

      - name: Install the disassembler and offline x64 emulator
        run: python -m pip install --quiet capstone unicorn==2.1.4

      - name: Check description identity evidence against the supplied PE images
        run: |
          python development/net-v21/tools/xlate_identity_pe_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/net-v21/tools/xlate_identity_emulation_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch the two reference modules (pinned, SHA-256 checked)
        run: python development/net-v21/tools/fetch_references.py

      - name: M1 - build the published sources exactly as published
        shell: cmd
        run: |
          if not exist development\net-v21\build mkdir development\net-v21\build
          call development\net-v21\build.bat baseline > development\net-v21\build\baseline.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\baseline.log
          exit /b %rc%

      - name: M2 - build the same tree plus the Steam layer
        shell: cmd
        run: |
          call development\net-v21\build.bat module > development\net-v21\build\module.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\module.log
          exit /b %rc%

      - name: M2 - build and run the Steam self-test (no Steam, no game needed)
        shell: cmd
        run: |
          call development\net-v21\build.bat selftest > development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\steam_selftest.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\steam_friends_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\netlog_selftest.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\vitals_core_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\vitals_randomized_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\hit_anim_wire_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\hit_anim_integration_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\vitals_integration_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\protocol_selftest.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\operation_turn_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\opsave_checked_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\map_file_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\map_file_windows_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\force_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\battle_file_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\retry_gate_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\atomic_file_selftest.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\reliable_inbox_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\ceasefire_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\env_value_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\tactical_mode_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\transform_write_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\transform_gc_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\transform_send_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\transform_inbox_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\transport_policy_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\peer_guard_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\state_fragments_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\statesync_integration_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\state_memory_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\hooks_selftest.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\render_guard_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\xlate_selftest.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\trench_thread_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\shots_integration_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\named_shots_integration_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\shots_xlate_characterization_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          python development\net-v21\tools\shots_compat_pair.py --legacy development\net-v21\build\selftest\shots_compat_107.exe --current development\net-v21\build\selftest\shots_compat_current.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          development\net-v21\build\selftest\late_input_test.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          python tests\test_switch_pair_windows.py >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          python development\net-v21\tools\loopback_pair.py --peer development\net-v21\build\selftest\loopback_peer.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          python development\net-v21\tools\session_loopback_pair.py --peer development\net-v21\build\selftest\session_loopback_peer.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          if not %rc%==0 exit /b %rc%
          python development\net-v21\tools\event_loopback_pair.py --peer development\net-v21\build\selftest\session_event_peer.exe >> development\net-v21\build\selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\selftest.log
          exit /b %rc%

      # Keep the failing test/compiler tail visible through the checks API, even where Actions'
      # external log/artifact storage is inaccessible. Tests here use only synthetic data.
      - name: Expose the self-test failure
        if: failure()
        shell: pwsh
        run: |
          $log = 'development/net-v21/build/selftest.log'
          if (Test-Path -LiteralPath $log) {
            $tail = ((Get-Content -LiteralPath $log -Tail 60) -join ' | ').Replace('%', '%25')
            Write-Output "::error title=Self-test log::$tail"
          }

      - name: M2 - build the command-line join launcher with the Steam layer
        shell: cmd
        run: |
          call development\net-v21\build.bat join > development\net-v21\build\join.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\join.log
          exit /b %rc%

      - name: Exercise the standalone launcher over IP and fake Steam (no game)
        shell: cmd
        run: |
          python development\net-v21\tools\standalone_loopback.py --peer development\net-v21\build\selftest\session_loopback_peer.exe --launcher development\net-v21\build\join\mp_join.exe --starter development\net-v21\build\selftest\starter_fixture.exe > development\net-v21\build\launcher-selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\launcher-selftest.log
          if not %rc%==0 (
            powershell -NoProfile -Command "$m = ((Get-Content development/net-v21/build/launcher-selftest.log -Tail 40) -join ' | ').Replace('%%','%%25'); Write-Output ('::error title=Launcher self-test::' + $m)"
            exit /b %rc%
          )

      - name: M1 - compare our baseline against the released v12 module
        shell: bash
        run: |
          python development/net-v21/tools/compare.py \
            --candidate development/net-v21/build/baseline/basic_network.codelib \
            --candidate-map development/net-v21/build/baseline/basic_network.map \
            --reference development/net-v21/references/v12.codelib \
            --reference-kind v12 --label "M1 baseline vs v12" \
            --out development/net-v21/build/compare-m1.md \
            --json development/net-v21/build/compare-m1.json \
            2>&1 | tee development/net-v21/build/compare-m1.log
          exit ${PIPESTATUS[0]}

      - name: M2 - compare our module against the v20 module players run
        shell: bash
        run: |
          python development/net-v21/tools/compare.py \
            --candidate development/net-v21/build/module/basic_network.codelib \
            --candidate-map development/net-v21/build/module/basic_network.map \
            --reference development/net-v21/references/v20.codelib \
            --reference-kind v20 --label "M2 module vs v20" \
            --focus steam,gtmf,presence,upnp,find_local \
            --out development/net-v21/build/compare-m2.md \
            --json development/net-v21/build/compare-m2.json \
            --missing-out development/net-v21/build/missing-m2.txt \
            2>&1 | tee development/net-v21/build/compare-m2.log
          exit ${PIPESTATUS[0]}

      - name: Self-test the battle report (the tool a two-PC run is read with)
        shell: bash
        run: |
          python development/net-v21/tools/battle_report_selftest.py \
            2>&1 | tee development/net-v21/build/battle-report-selftest.log
          exit ${PIPESTATUS[0]}

      # This fixture uses the old kit metadata for regression testing only. It stays in the
      # ignored build folder and is not a release; 1.0.7 remains byte-for-byte preserved.
      - name: Package a disposable unified installer fixture
        shell: bash
        run: |
          python scripts/package_net_v21_test.py \
            --codelib development/net-v21/build/module/basic_network.codelib \
            --launcher development/net-v21/build/join/mp_join.exe \
            --output development/net-v21/build/CI_fixture_NOT_RELEASE.zip \
            2>&1 | tee development/net-v21/build/package.log
          exit ${PIPESTATUS[0]}

      - name: Exercise the packaged one-step installer and recovery on Windows
        shell: cmd
        env:
          MIUS_TEST_ARCHIVE: development/net-v21/build/CI_fixture_NOT_RELEASE.zip
          MIUS_TEST_STATE: unified_test_v107_experimental
          MIUS_TEST_UPGRADE: '1'
        run: |
          python tests\test_unified_installer_windows.py > development\net-v21\build\installer-selftest.log 2>&1
          set rc=%errorlevel%
          type development\net-v21\build\installer-selftest.log
          if not %rc%==0 (
            powershell -NoProfile -Command "$m = ((Get-Content development/net-v21/build/installer-selftest.log -Tail 50) -join ' | ').Replace('%%','%%25'); Write-Output ('::error title=Installer self-test::' + $m)"
            exit /b %rc%
          )

      # One-shot, branch-scoped publication approved by the user. Remove this step and its
      # temporary contents:write permission once the new archive is safely in the branch.
      - name: Publish the validated experimental installer once
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/41eedd9d-miusvitals'
        shell: bash
        run: |
          set -euo pipefail
          archive=MiusMultiplayer_v1.0.7_EXPERIMENTAL_INSTALL.zip
          test ! -e "$archive"  # never replace any existing archive
          python scripts/package_net_v21_test.py \
            --codelib development/net-v21/build/module/basic_network.codelib \
            --launcher development/net-v21/build/join/mp_join.exe \
            --output "$archive"
          cmp "$archive" development/net-v21/build/CI_fixture_NOT_RELEASE.zip
          python scripts/package_net_v21_test.py --verify "$archive" --verify-source
          sha256sum "$archive"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$archive"
          git commit -m 'Add validated 1.0.7 experimental installer'
          git push origin HEAD:refs/heads/arena/41eedd9d-miusvitals

      - name: Put the numbers in the job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## M1: our build of the published sources vs the released v12 module'
            cat development/net-v21/build/compare-m1.md 2>/dev/null || echo 'no comparison: the build did not produce a module'
            echo
            echo '## M2: our module (published sources + Steam layer) vs the v20 module'
            cat development/net-v21/build/compare-m2.md 2>/dev/null || echo 'no comparison: the build did not produce a module'
          } >> "$GITHUB_STEP_SUMMARY"

      # The job log is not reachable from outside this cluster (the log endpoint is blocked), so the
      # compiler output is mirrored into a pull-request comment while the build is being brought up.
      - name: Mirror the compiler output into the pull request
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The job log is not reachable from where this build is checked, so the output has to be
          # reachable somewhere else.  On a pull request that is the request itself; on a push it is
          # whatever request is open for this branch, which is how work continues after a merge.
          number="${{ github.event.number }}"
          if [ -z "$number" ]; then
            number=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          fi
          if [ -z "$number" ]; then echo "no pull request to mirror into"; exit 0; fi
          body=/tmp/build-comment.md
          {
            echo "### network module build (${{ github.sha }})"
            for report in compare-m1 compare-m2; do
              echo
              echo "#### $report"
              cat "development/net-v21/build/$report.md" 2>/dev/null || echo "no $report report"
            done
            if [ -f development/net-v21/build/missing-m2.txt ]; then
              echo
              echo "<details><summary>every missing work item, by milestone</summary>"
              echo
              echo '```'
              cat development/net-v21/build/missing-m2.txt
              echo '```'
              echo
              echo '</details>'
            fi
            echo
            if [ -f MiusMultiplayer_v1.0.7_TEST_INSTALL.zip ]; then
              echo "preserved 1.0.7 installer (not the current build): sha256 $(sha256sum MiusMultiplayer_v1.0.7_TEST_INSTALL.zip | cut -d' ' -f1)"
            fi
            if [ -f development/net-v21/build/CI_fixture_NOT_RELEASE.zip ]; then
              echo "current build: disposable installer fixture only, not a release"
            fi
            for name in committed-installer baseline module selftest join launcher-selftest installer-selftest battle-report-selftest package compare-m1 compare-m2; do
              log="development/net-v21/build/$name.log"
              echo
              echo "<details><summary>$name log</summary>"
              echo
              echo '```'
              if [ -f "$log" ]; then tail -c 6000 "$log"; else echo "$name: no log produced"; fi
              echo '```'
              echo
              echo '</details>'
            done
          } > "$body"
          gh pr comment "$number" --body-file "$body"

      - name: Upload the build, the logs and both comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-module
          path: |
            development/net-v21/build/**
            !development/net-v21/build/CI_fixture_NOT_RELEASE.zip
          if-no-files-found: warn
          retention-days: 14
